name: Skill Validator

on:
  pull_request:
    paths:
      - 'claude-native-skills/**/*.md'

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Validator
        run: python scripts/validate_skills.py
